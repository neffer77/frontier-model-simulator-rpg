name: Bootstrap deterministic screenshot baseline

on:
  push:
    branches:
      - feature/p5-2-11-native-company

permissions:
  contents: write

concurrency:
  group: screenshot-baseline-bootstrap
  cancel-in-progress: true

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p5-2-11-native-company
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./node_modules/playwright/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Download Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Build production site
        run: npm run build:site
      - name: Start production site
        run: python3 -m http.server 4173 --directory _site >/tmp/frontier-baseline-server.log 2>&1 &
      - name: Generate active deterministic baseline
        run: npm run visual:screenshot-baseline
      - name: Validate complete baseline
        run: |
          node - <<'NODE'
          const b=require('./visual-qa/screenshot-baseline.json');
          if(b.status!=='active'||b.expectedCaptureCount!==255||Object.keys(b.captures||{}).length!==255)process.exit(1);
          console.log(`Validated ${Object.keys(b.captures).length} active screenshot baselines`);
          NODE
      - name: Commit promoted baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-qa/screenshot-baseline.json
          if git diff --cached --quiet; then
            echo 'Baseline already active; nothing to commit.'
          else
            git commit -m 'Activate deterministic screenshot baseline'
            git push origin HEAD:feature/p5-2-11-native-company
          fi
