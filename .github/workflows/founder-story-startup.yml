name: Founder story startup and domain regressions

on:
  pull_request:
    paths:
      - 'tests/helpers/founder-story.mjs'
      - 'tests/founder-story-startup.mjs'
      - 'tests/technical-realism.mjs'
      - 'tests/balance-pacing.mjs'
      - 'story-integration.js'
      - 'package.json'
      - '.github/workflows/founder-story-startup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: founder-story-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  founder-story:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(node -p "require('./node_modules/playwright/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium system dependencies on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 2
        run: npx playwright install-deps chromium
      - name: Download Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Build production site
        run: npm run build:site
      - name: Start site
        run: python3 -m http.server 4173 --directory _site >/tmp/founder-story-server.log 2>&1 &
      - name: Verify story startup and technical realism
        run: npm run test:realism
      - name: Verify balance and pacing
        run: npm run test:balance
      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founder-story-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/founder-story-startup
          if-no-files-found: warn
          retention-days: 30
