name: FrontierOS navigation session evidence

on:
  pull_request:
    paths:
      - 'frontieros-session.js'
      - 'frontieros-session.css'
      - 'mobile-frontieros.js'
      - 'desktop-frontieros.js'
      - 'frontier-app-registry.js'
      - 'tests/frontieros-session.mjs'
      - 'tests/frontieros-session-static.mjs'
      - 'tests/release-gate.mjs'
      - 'release-gate-policy.json'
      - '.github/workflows/frontieros-session.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontieros-session-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./node_modules/playwright/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Download Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Report Playwright cache
        run: |
          echo "Playwright Chromium cache hit: ${{ steps.playwright-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build production site
        run: npm run build:site
      - name: Start production server
        run: python3 -m http.server 4173 --directory _site > /tmp/frontieros-session-server.log 2>&1 &
      - name: Run static contract
        run: npm run test:os-session-static
      - name: Run browser evidence
        run: npm run test:os-session
        env:
          TEST_URL: http://127.0.0.1:4173/
          OS_SESSION_PHASE_TIMEOUT_MS: '12000'
          OS_SESSION_TEST_TIMEOUT_MS: '90000'
      - name: Publish summary
        if: always()
        run: |
          if [ -f artifacts/frontieros-session/REPORT.md ]; then cat artifacts/frontieros-session/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f artifacts/frontieros-session/progress.json ]; then
            echo '### P5.1.4 phase checkpoints' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/frontieros-session/progress.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload P5.1.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontieros-session-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/frontieros-session
          if-no-files-found: error
          retention-days: 30
