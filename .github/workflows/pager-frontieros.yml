name: FrontierOS Pager evidence

on:
  pull_request:
    paths:
      - 'pager-frontieros.js'
      - 'pager-frontieros.css'
      - 'frontier-app-registry.js'
      - 'tests/pager-frontieros.mjs'
      - '.github/workflows/pager-frontieros.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build production site
        run: npm run build:site
      - name: Start production server
        run: python3 -m http.server 4173 --directory _site > /tmp/pager-server.log 2>&1 &
      - name: Run Pager browser evidence
        run: node tests/pager-frontieros.mjs
        env:
          TEST_URL: http://127.0.0.1:4173/
      - name: Publish summary
        if: always()
        run: |
          if [ -f artifacts/pager-frontieros/REPORT.md ]; then cat artifacts/pager-frontieros/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload Pager evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pager-frontieros-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/pager-frontieros
          if-no-files-found: error
          retention-days: 30
