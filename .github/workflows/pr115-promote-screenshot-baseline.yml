name: PR 115 promote reviewed screenshot baseline

on:
  push:
    branches:
      - feature/p5-2-11-native-company
    paths:
      - '.github/pr115-promote-screenshot-baseline'

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p5-2-11-native-company
          fetch-depth: 0

      - name: Download reviewed Cross-device evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/9374568310/zip > /tmp/pr115-evidence.zip
          unzip -p /tmp/pr115-evidence.zip 'screenshot-regression/candidate-baseline.json' > visual-qa/screenshot-baseline.json

      - name: Record baseline promotion provenance
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='visual-qa/screenshot-baseline.json';
          const baseline=JSON.parse(fs.readFileSync(path,'utf8'));
          if(Object.keys(baseline.captures||{}).length!==255)throw new Error('reviewed candidate must contain exactly 255 captures');
          baseline.promotion={
            item:'13.17',
            reviewed:true,
            source:'PR #115 Cross-device browser QA run 32276025215 artifact 9374568310',
            sourceHeadSha:'c62d4275236953349488beafd209fb43470491a1',
            rationale:'Reviewed deterministic candidate after intentional FrontierOS Company/dashboard and actionable zero-state visual changes.'
          };
          fs.writeFileSync(path,JSON.stringify(baseline,null,2)+'\n');
          NODE

      - name: Commit promoted baseline and remove one-shot trigger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr115-promote-screenshot-baseline.yml .github/pr115-promote-screenshot-baseline
          git add visual-qa/screenshot-baseline.json
          git commit -m 'Promote reviewed PR 115 screenshot baseline'
          git push origin HEAD:feature/p5-2-11-native-company
