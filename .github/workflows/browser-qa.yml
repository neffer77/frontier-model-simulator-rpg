name: Cross-device browser QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund

      - name: Static release integrity and size budgets
        run: npm run test:static

      - name: Assemble production artifact
        run: npm run build:site

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full browser release-candidate suite, route crawl, visual inventory, and screenshot regression against _site
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/frontier-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          if ! curl -fsS http://127.0.0.1:4173/ >/dev/null; then
            cat /tmp/frontier-http.log
            exit 1
          fi

          set +e
          npm run test:qa
          QA_STATUS=$?
          npm run visual:inventory
          VISUAL_STATUS=$?
          npm run test:screenshots
          SCREENSHOT_STATUS=$?
          set -e

          if [ "$QA_STATUS" -ne 0 ] || [ "$VISUAL_STATUS" -ne 0 ] || [ "$SCREENSHOT_STATUS" -ne 0 ]; then
            echo "RC QA status: $QA_STATUS"
            echo "Visual inventory status: $VISUAL_STATUS"
            echo "Screenshot regression status: $SCREENSHOT_STATUS"
            exit 1
          fi

      - name: Upload Item 13.1 visual inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-inventory-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/visual-inventory
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Item 13.14 screenshot regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-regression-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/screenshot-regression
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Item 13.15 route crawl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-crawl-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/route-crawl
          if-no-files-found: warn
          retention-days: 14
