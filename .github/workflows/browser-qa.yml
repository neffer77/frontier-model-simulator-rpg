name: Cross-device browser QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./node_modules/playwright/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium system dependencies on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 2
        run: npx playwright install-deps chromium

      - name: Download Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Report Playwright cache
        run: echo "Playwright Chromium cache hit: ${{ steps.playwright-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"

      # Full canonical release validation is intentionally required for PRs,
      # main pushes, and explicit release runs. Dedicated app workflows provide
      # faster focused feedback, but they do not replace this release gate.
      - name: Execute canonical Item 13.16 release gate
        id: release-gate
        run: npm run test:rc

      - name: Finalize Item 13.17 release sign-off
        if: always() && steps.release-gate.outcome != 'skipped' && steps.release-gate.outcome != 'cancelled'
        run: npm run test:signoff

      - name: Publish release and FrontierOS evidence
        if: always()
        shell: bash
        run: |
          # Item 13.1 visual inventory
          # Item 13.14 screenshot regression evidence
          # Item 13.15 route crawl evidence
          # Item 13.16 release decision
          # Item 13.17 release sign-off
          # P5.0.1 runtime identity evidence
          # P5.0.2 Command + Event Bus evidence
          # P5.0.3 Debug Bundle + Diagnostics evidence
          # P5.1.1 FrontierOS App Registry evidence
          # P5.1.2 Mobile FrontierOS evidence
          # P5.1.3 Desktop FrontierOS evidence
          # P5.1.4 Navigation + Session evidence
          # P5.2.1 Pager evidence
          # P5.2.2 Run Monitor evidence
          # P5.2.3 EvalBench evidence
          # P5.2.4 Model Lab evidence
          # P5.2.5 Data Explorer evidence
          # P5.2.6 Terminal evidence
          # P5.2.7 Frontier Mail evidence
          # P5.2.8 People evidence
          # P5.2.9 Projects evidence
          # P5.2.10 Finance evidence
          # P5.2.11 Company evidence
          for report in \
            artifacts/visual-inventory/REPORT.md \
            artifacts/screenshot-regression/REPORT.md \
            artifacts/route-crawl/REPORT.md \
            artifacts/release-gate/REPORT.md \
            artifacts/release-signoff/REPORT.md \
            artifacts/state-identity/REPORT.md \
            artifacts/command-event-bus/REPORT.md \
            artifacts/debug-bundle/REPORT.md \
            artifacts/app-registry/REPORT.md \
            artifacts/mobile-frontieros/REPORT.md \
            artifacts/desktop-frontieros/REPORT.md \
            artifacts/frontieros-session/REPORT.md \
            artifacts/pager-frontieros/REPORT.md \
            artifacts/run-monitor-frontieros/REPORT.md \
            artifacts/evalbench-frontieros/REPORT.md \
            artifacts/model-lab-frontieros/REPORT.md \
            artifacts/data-explorer-frontieros/REPORT.md \
            artifacts/terminal-frontieros/REPORT.md \
            artifacts/frontier-mail/REPORT.md \
            artifacts/people-frontieros/REPORT.md \
            artifacts/projects-frontieros/REPORT.md \
            artifacts/finance-frontieros/REPORT.md \
            artifacts/company-frontieros/REPORT.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              printf '\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload cross-device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-device-evidence-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 30
