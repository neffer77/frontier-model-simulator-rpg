name: Cross-device browser QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund

      - name: Static release integrity and size budgets
        run: npm run test:static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full browser release-candidate suite
        run: |
          python3 -m http.server 4173 >/tmp/frontier-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          if ! curl -fsS http://127.0.0.1:4173/ >/dev/null; then
            cat /tmp/frontier-http.log
            exit 1
          fi
          npm run test:qa
