name: Cross-device browser QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p \"require('./node_modules/playwright/package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Download Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Report Playwright cache
        run: echo "Playwright Chromium cache hit: ${{ steps.playwright-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Execute canonical Item 13.16 release gate
        run: npm run test:rc

      - name: Finalize Item 13.17 release sign-off
        if: always()
        run: npm run test:signoff

      - name: Publish Item 13.16 release decision
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/release-gate/REPORT.md ]; then
            cat artifacts/release-gate/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '# Item 13.16 release gate'
              echo
              echo '**Decision unavailable:** the release-gate runner did not produce `artifacts/release-gate/REPORT.md`.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish P5.0.1 runtime identity evidence
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/state-identity/REPORT.md ]; then cat artifacts/state-identity/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publish P5.0.2 Command + Event Bus evidence
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/command-event-bus/REPORT.md ]; then cat artifacts/command-event-bus/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publish P5.0.3 Debug Bundle + Diagnostics evidence
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/debug-bundle/REPORT.md ]; then cat artifacts/debug-bundle/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publish P5.1.1 FrontierOS App Registry evidence
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/app-registry/REPORT.md ]; then cat artifacts/app-registry/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publish P5.1.2 Mobile FrontierOS evidence
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/mobile-frontieros/REPORT.md ]; then cat artifacts/mobile-frontieros/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publish P5.1.3 Desktop FrontierOS evidence
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/desktop-frontieros/REPORT.md ]; then cat artifacts/desktop-frontieros/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publish P5.1.4 Navigation + Session evidence
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/frontieros-session/REPORT.md ]; then cat artifacts/frontieros-session/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publish P5.2.1 Pager evidence
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/pager-frontieros/REPORT.md ]; then cat artifacts/pager-frontieros/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publish P5.2.2 Run Monitor evidence
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/run-monitor-frontieros/REPORT.md ]; then cat artifacts/run-monitor-frontieros/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publish P5.2.3 EvalBench evidence
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/evalbench-frontieros/REPORT.md ]; then cat artifacts/evalbench-frontieros/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publish Item 13.17 release sign-off
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/release-signoff/REPORT.md ]; then
            cat artifacts/release-signoff/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '# Item 13.17 release sign-off'
              echo
              echo '**Sign-off unavailable:** the sign-off runner did not produce `artifacts/release-signoff/REPORT.md`.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload P5.0.1 runtime identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-identity-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/state-identity
          if-no-files-found: warn
          retention-days: 30

      - name: Upload P5.0.2 Command + Event Bus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-event-bus-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/command-event-bus
          if-no-files-found: warn
          retention-days: 30

      - name: Upload P5.0.3 Debug Bundle + Diagnostics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-bundle-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/debug-bundle
          if-no-files-found: warn
          retention-days: 30

      - name: Upload P5.1.1 FrontierOS App Registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-registry-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/app-registry
          if-no-files-found: warn
          retention-days: 30

      - name: Upload P5.1.2 Mobile FrontierOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-frontieros-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/mobile-frontieros
          if-no-files-found: warn
          retention-days: 30

      - name: Upload P5.1.3 Desktop FrontierOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-frontieros-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/desktop-frontieros
          if-no-files-found: warn
          retention-days: 30

      - name: Upload P5.1.4 Navigation + Session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontieros-session-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/frontieros-session
          if-no-files-found: warn
          retention-days: 30

      - name: Upload P5.2.1 Pager evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pager-frontieros-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/pager-frontieros
          if-no-files-found: warn
          retention-days: 30

      - name: Upload P5.2.2 Run Monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-monitor-frontieros-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/run-monitor-frontieros
          if-no-files-found: warn
          retention-days: 30

      - name: Upload P5.2.3 EvalBench evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evalbench-frontieros-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/evalbench-frontieros
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Item 13.17 release sign-off
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-signoff-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/release-signoff
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Item 13.16 release decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/release-gate
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Item 13.1 visual inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-inventory-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/visual-inventory
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Item 13.14 screenshot regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-regression-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/screenshot-regression
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Item 13.15 route crawl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-crawl-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/route-crawl
          if-no-files-found: warn
          retention-days: 14
