name: Deploy Frontier Model Simulator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static release integrity and performance budgets
        run: npm run test:static

  release-candidate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full release-candidate regression suite
        run: |
          python3 -m http.server 4173 >/tmp/frontier-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          if ! curl -fsS http://127.0.0.1:4173/ >/dev/null; then
            cat /tmp/frontier-http.log
            exit 1
          fi
          npm run test:qa

  build:
    needs: release-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble minimal runtime site
        run: npm run build:site
      - name: Verify release artifact contains no repo-only tooling
        run: |
          test -f _site/index.html
          test -f _site/sw.js
          test -f _site/build-info.json
          test ! -e _site/tests
          test ! -e _site/docs
          test ! -e _site/package.json
          echo "Release artifact: $(find _site -type f | wc -l) files / $(du -sh _site | cut -f1)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
