name: Deploy Frontier Model Simulator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static release integrity and performance budgets
        run: npm run test:static

  release-candidate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Execute canonical Item 13.16 release gate
        id: release-gate
        run: npm run test:rc
      - name: Finalize Item 13.17 release sign-off
        if: always() && steps.release-gate.outcome != 'skipped' && steps.release-gate.outcome != 'cancelled'
        run: npm run test:signoff
      - name: Publish release decision
        if: always()
        run: |
          for report in artifacts/release-gate/REPORT.md artifacts/release-signoff/REPORT.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload Pages release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-release-evidence-${{ github.run_number }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 30

  build:
    needs: release-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble minimal runtime site
        run: npm run build:site
      - name: Verify release artifact contains runtime identity and no repo-only tooling
        run: |
          test -f _site/index.html
          test -f _site/sw.js
          test -f _site/build-info.json
          test -f _site/frontier-build.js
          test -f _site/state-identity.js
          EXPECTED="${GITHUB_SHA:0:12}"
          grep -Fq "\"buildId\":\"$EXPECTED\"" _site/frontier-build.js
          test ! -e _site/tests
          test ! -e _site/docs
          test ! -e _site/package.json
          echo "Release artifact: $(find _site -type f | wc -l) files / $(du -sh _site | cut -f1)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify live site serves this release commit and runtime identity
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          EXPECTED="${GITHUB_SHA:0:12}"
          BASE="${PAGE_URL%/}"
          for i in {1..30}; do
            INFO=$(curl -fsS "$BASE/build-info.json?release=$GITHUB_SHA" 2>/dev/null || true)
            RUNTIME=$(curl -fsS "$BASE/frontier-build.js?release=$GITHUB_SHA" 2>/dev/null || true)
            if printf '%s' "$INFO" | grep -Fq "\"version\": \"$EXPECTED\"" && printf '%s' "$RUNTIME" | grep -Fq "\"buildId\":\"$EXPECTED\""; then
              curl -fsS "$BASE/?release=$GITHUB_SHA" >/dev/null
              echo "Live Pages release + runtime identity verified: $EXPECTED"
              exit 0
            fi
            sleep 2
          done
          echo "::error::GitHub Pages did not serve build identity $EXPECTED within the verification window"
          curl -fsS "$BASE/build-info.json?release=$GITHUB_SHA" || true
          curl -fsS "$BASE/frontier-build.js?release=$GITHUB_SHA" || true
          exit 1
