name: Deploy Frontier Model Simulator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static release integrity and performance budgets
        run: npm run test:static

  release-prepare:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build-ready: ${{ steps.bundle.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund
      - name: Execute preflight and production build
        env:
          RELEASE_GATE_PART: prepare
        run: npm run test:rc
      - name: Package tested build
        id: bundle
        if: always()
        run: |
          if node -e "const r=require('./release-part/report.json');process.exit(r.gates.some(g=>g.id==='production-build'&&g.status==='pass')?0:1)" && test -f _site/build-info.json; then
            tar -czf release-site.tar.gz _site
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.bundle.outputs.ready == 'true'
        with:
          name: release-tested-site
          path: release-site.tar.gz
          overwrite: true
          retention-days: 30
      - name: Package preflight evidence
        if: always()
        run: |
          mkdir -p release-part artifacts
          tar -czf release-part.tar.gz release-part artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-part-prepare
          path: release-part.tar.gz
          overwrite: true
          retention-days: 30

  release-shards:
    needs: release-prepare
    if: ${{ !cancelled() && needs.release-prepare.outputs.build-ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [native-core, mail-journeys, legacy-gameplay, legacy-ui, responsive, routes, screenshots, inventory]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./node_modules/playwright/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium system dependencies on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 2
        run: npx playwright install-deps chromium
      - name: Download Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Report Playwright cache
        run: |
          echo "Playwright Chromium cache hit: ${{ steps.playwright-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: release-tested-site
      - name: Restore tested production build
        run: tar -xzf release-site.tar.gz
      - name: Execute assigned canonical release gates
        env:
          RELEASE_GATE_PART: ${{ matrix.shard }}
        run: npm run test:rc
      - name: Package shard evidence
        if: always()
        run: |
          mkdir -p release-part artifacts
          tar -czf release-part.tar.gz release-part artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-part-${{ matrix.shard }}
          path: release-part.tar.gz
          overwrite: true
          retention-days: 30

  release-candidate:
    needs: [release-prepare, release-shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-tested-site
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: release-part-*
          path: release-parts
      - name: Restore build and isolated shard evidence
        continue-on-error: true
        run: |
          if test -f release-site.tar.gz; then tar -xzf release-site.tar.gz; fi
          for bundle in release-parts/*/release-part.tar.gz; do
            if test -f "$bundle"; then tar -xzf "$bundle" -C "$(dirname "$bundle")"; fi
          done
      - name: Execute canonical Item 13.16 release gate
        id: release-gate
        env:
          RELEASE_GATE_PART: aggregate
          RELEASE_PREPARE_RESULT: ${{ needs.release-prepare.result }}
          RELEASE_SHARDS_RESULT: ${{ needs.release-shards.result }}
        run: npm run test:rc
      - name: Finalize Item 13.17 release sign-off
        if: always() && steps.release-gate.outcome != 'skipped' && steps.release-gate.outcome != 'cancelled'
        run: npm run test:signoff
      - name: Publish release decision
        if: always()
        run: |
          for report in artifacts/release-gate/REPORT.md artifacts/release-signoff/REPORT.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload Pages release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-release-evidence-${{ github.run_number }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 30

  build:
    needs: release-candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/download-artifact@v4
        with:
          name: release-tested-site
      - name: Assemble minimal runtime site from tested build
        run: tar -xzf release-site.tar.gz
      - name: Verify release artifact contains runtime identity and no repo-only tooling
        run: |
          test -f _site/index.html
          test -f _site/sw.js
          test -f _site/build-info.json
          test -f _site/frontier-build.js
          test -f _site/state-identity.js
          EXPECTED="${GITHUB_SHA:0:12}"
          grep -Fq "\"buildId\":\"$EXPECTED\"" _site/frontier-build.js
          test ! -e _site/tests
          test ! -e _site/docs
          test ! -e _site/package.json
          echo "Release artifact: $(find _site -type f | wc -l) files / $(du -sh _site | cut -f1)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify live site serves this release commit and runtime identity
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          EXPECTED="${GITHUB_SHA:0:12}"
          BASE="${PAGE_URL%/}"
          for i in {1..30}; do
            INFO=$(curl -fsS "$BASE/build-info.json?release=$GITHUB_SHA" 2>/dev/null || true)
            RUNTIME=$(curl -fsS "$BASE/frontier-build.js?release=$GITHUB_SHA" 2>/dev/null || true)
            if printf '%s' "$INFO" | grep -Fq "\"version\": \"$EXPECTED\"" && printf '%s' "$RUNTIME" | grep -Fq "\"buildId\":\"$EXPECTED\""; then
              curl -fsS "$BASE/?release=$GITHUB_SHA" >/dev/null
              echo "Live Pages release + runtime identity verified: $EXPECTED"
              exit 0
            fi
            sleep 2
          done
          echo "::error::GitHub Pages did not serve build identity $EXPECTED within the verification window"
          curl -fsS "$BASE/build-info.json?release=$GITHUB_SHA" || true
          curl -fsS "$BASE/frontier-build.js?release=$GITHUB_SHA" || true
          exit 1
